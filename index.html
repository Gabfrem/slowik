  <script>
    /* Applique le thème et le niveau d'animation avant le premier rendu (évite un flash). */
    try {
      var st = (JSON.parse(localStorage.getItem('slowik.v1') || '{}').settings) || {};
      if (st.theme && st.theme !== 'auto') document.documentElement.setAttribute('data-theme', st.theme);
      if (st.motion === 'reduced' || (st.motion === 'auto' && matchMedia('(prefers-reduced-motion: reduce)').matches)) document.documentElement.setAttribute('data-motion', 'reduced');
    } catch (e) {}
  </script>
